<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Rapor Haritası</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
    }
    #map {
      width: 100%;
      height: 400px;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // URL parametresinden noktaları al
  const params = new URLSearchParams(window.location.search);
  const pointsParam = params.get("points");

  const points = pointsParam
    ? pointsParam.split(";").map(p => {
        const [lat, lon] = p.split(",").map(Number);
        return [lat, lon];
      })
    : [];

  const map = L.map("map");

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19
  }).addTo(map);

  if (points.length > 0) {
    const polygon = L.polygon(points, {
      color: "red",
      weight: 3,
      fillOpacity: 0.25
    }).addTo(map);

    map.fitBounds(polygon.getBounds(), {
      padding: [20, 20]
    });
  } else {
    map.setView([38.6811, 39.2203], 16);
  }

  // 🔴 PUPPETEER BU SATIRI BEKLİYOR
  window.__MAP_READY__ = true;
</script>

</body>
</html>
